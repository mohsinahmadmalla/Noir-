<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Million Cafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --black: #0a0a0a; --white: #ffffff; --gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: var(--white); font-family: 'Poppins', sans-serif; }
        header { padding: 2rem; border-bottom: 1px solid #333; text-align: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        
        .menu-section { padding: 4rem 10%; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 2rem; }
        
        .menu-tabs { display: flex; gap: 2rem; margin-bottom: 3rem; border-bottom: 1px solid #333; }
        .menu-tab { background: none; border: none; color: #888; font-size: 1.2rem; padding: 1rem 0; cursor: pointer; transition: 0.3s; }
        .menu-tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .menu-item { background: var(--gray); padding: 1.5rem; border-radius: 8px; border: 1px solid #333; transition: 0.3s; }
        .menu-item:hover { border-color: var(--gold); transform: translateY(-5px); }
        .item-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .item-name { font-weight: 600; font-size: 1.1rem; }
        .item-price { color: var(--gold); font-weight: 600; }
        .item-desc { font-size: 0.9rem; color: #888; margin-bottom: 1rem; }
        
        .btn-add { width: 100%; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 0.6rem; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: var(--gold); color: var(--black); }

        .empty-msg { color: #888; font-style: italic; grid-column: 1/-1; padding: 2rem 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Half Million Cafe</div>
    </header>

    <section class="menu-section">
        <h2 class="section-title">The Menu</h2>
        <div class="menu-tabs">
            <button id="tab-coffee" class="menu-tab active" onclick="switchTab('coffee')">Coffee</button>
            <button id="tab-food" class="menu-tab" onclick="switchTab('food')">Food</button>
        </div>
        <div id="menu-container" class="menu-grid">
            </div>
    </section>

    <script>
        // 1. CONFIGURATION
        const SB_URL = 'YOUR_SUPABASE_URL'; 
        const SB_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        window.menuData = { coffee: [], food: [] };

        // 2. DATABASE FUNCTIONS
        async function loadMenuFromSupabase() {
            try {
                const { data, error } = await sb.from('menu_items').select('*');
                
                if (error) throw error;

                // Organizing data and matching your lowercase Supabase columns
                window.menuData = {
                    coffee: data.filter(item => (item.category || "").trim().toLowerCase() === 'coffee')
                                .map(item => ({
                                    name: item.name || "Unknown Coffee",
                                    price: item.price || 0,
                                    emoji: item.emoji || "☕"
                                })),
                    food: data.filter(item => (item.category || "").trim().toLowerCase() === 'food')
                              .map(item => ({
                                  name: item.name || "Unknown Food",
                                  price: item.price || 0,
                                  emoji: item.emoji || "🍽️"
                              }))
                };

                renderMenu('coffee'); // Initial load
            } catch (err) {
                console.error("Error loading menu:", err.message);
                document.getElementById('menu-container').innerHTML = `<p class="empty-msg">Error loading menu. Check Supabase connection.</p>`;
            }
        }

        // 3. UI FUNCTIONS
        function renderMenu(category) {
            const container = document.getElementById('menu-container');
            const items = window.menuData[category];
            
            if (!items || items.length === 0) {
                container.innerHTML = `<p class="empty-msg">No items found in the ${category} category. Check your Supabase rows!</p>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="menu-item">
                    <div class="item-header">
                        <span class="item-name">${item.emoji} ${item.name}</span>
                        <span class="item-price">₹${item.price}</span>
                    </div>
                    <p class="item-desc">Premium quality selection.</p>
                    <button class="btn-add">Add to Order</button>
                </div>
            `).join('');
        }

        function switchTab(category) {
            document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${category}`).classList.add('active');
            renderMenu(category);
        }

        // START
        loadMenuFromSupabase();
    </script>
</body>
</html>
