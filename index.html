<!DOCTYPE html>
<html>
<head>
    <title>Half Million Cafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .gold { color: #c5a059; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        button { background: #c5a059; border: none; padding: 10px; cursor: pointer; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1 class="gold">HALF MILLION CAFE</h1>
    <p>Loading your fresh menu...</p>

    <div>
        <button onclick="render('coffee')">COFFEE</button>
        <button onclick="render('food')">FOOD</button>
    </div>

    <div id="menu-display" class="grid"></div>

    <script>
        // 1. PASTE YOUR DATA HERE
        const URL = 'https://jdiglozprfttehmcijtc.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkaWdsb3pwcmZ0dGVobWNpanRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNjQ5MzYsImV4cCI6MjA5Mjc0MDkzNn0.hTngMGloNsK0XTsBIUAvZQIzUSG65CZcWb56FFFhfmE';
        const sb = supabase.createClient(URL, KEY);

        let databaseItems = [];

        // 2. FETCH DATA FROM TABLE
        async function getData() {
            // We use 'menu_item' because that is what your table is named
            const { data, error } = await sb.from('menu_item').select('*');
            
            if (error) {
                console.error("Error:", error);
                document.getElementById('menu-display').innerHTML = "Error: " + error.message;
                return;
            }

            databaseItems = data;
            render('coffee'); // Show coffee first
        }

        // 3. SHOW DATA ON SCREEN
        function render(cat) {
            const container = document.getElementById('menu-display');
            
            // Filter items by category (lowercase check)
            const filtered = databaseItems.filter(i => 
                (i.category || "").toLowerCase() === cat
            );

            if (filtered.length === 0) {
                container.innerHTML = `No items found in "${cat}". check your Supabase rows!`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="card">
                    <h2>${item.emoji || '☕'} ${item.name || 'No Name'}</h2>
                    <p class="gold">₹${item.price || '0'}</p>
                </div>
            `).join('');
        }

        getData();
    </script>
</body>
</html>
